[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-statement-assistant"
version = "0.1.0"
description = "Private local bank statement analysis application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.4",
  "anyio==4.10.0",
  "fastapi==0.116.1",
  "mcp==1.28.1",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "pypdf==6.16.2",
  "playwright==1.55.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.42",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[project.scripts]
bsa-api = "bank_statement_assistant.adapters.http.main:run"
bsa-worker = "bank_statement_assistant.adapters.worker.main:run"
bsa-openapi = "bank_statement_assistant.openapi:run"
bsa-schema-ready = "bank_statement_assistant.adapters.postgres.health:run"
bsa-mcp = "bank_statement_assistant.adapters.mcp.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_statement_assistant"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bank_statement_assistant"]
