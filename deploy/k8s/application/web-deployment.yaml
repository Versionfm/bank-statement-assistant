apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: bank-statement-assistant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: bank-statement-assistant:RELEASE_IMAGE
          imagePullPolicy: Never
          command: ["bsa-api"]
          envFrom:
            - configMapRef:
                name: bank-statement-assistant-config
            - secretRef:
                name: bank-statement-assistant-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: statement-files
              mountPath: /var/lib/bank-statement-assistant/statements
        - name: mcp
          image: bank-statement-assistant:RELEASE_IMAGE
          imagePullPolicy: Never
          command: ["bsa-mcp"]
          envFrom:
            - configMapRef:
                name: bank-statement-assistant-config
            - secretRef:
                name: bank-statement-assistant-secrets
          ports:
            - name: mcp
              containerPort: 8765
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: statement-files
              mountPath: /var/lib/bank-statement-assistant/statements
      volumes:
        - name: statement-files
          persistentVolumeClaim:
            claimName: statement-files
