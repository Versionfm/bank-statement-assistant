apiVersion: v1
kind: Secret
metadata:
  name: bank-statement-assistant-secrets
  namespace: bank-statement-assistant
type: Opaque
stringData:
  POSTGRES_DB: bank_statement_assistant
  POSTGRES_USER: bank_statement_assistant
  POSTGRES_PASSWORD: replace-with-a-long-random-value
  BSA_DATABASE_URL: postgresql+psycopg://bank_statement_assistant:replace-with-a-long-random-value@postgres:5432/bank_statement_assistant
