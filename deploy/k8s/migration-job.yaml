apiVersion: batch/v1
kind: Job
metadata:
  generateName: bank-statement-assistant-migration-
  namespace: bank-statement-assistant
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/part-of: bank-statement-assistant
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/part-of: bank-statement-assistant
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: bank-statement-assistant:RELEASE_IMAGE
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: bank-statement-assistant-config
            - secretRef:
                name: bank-statement-assistant-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
